{% extends 'base.html' %}
{% load static %}

{% block title %}Créer une Story — MARA{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#0B0E14] text-white flex flex-col justify-between pb-24">

  <!-- Top Header -->
  <header class="flex items-center justify-between px-5 pt-8 pb-4 border-b border-white/5">
    <a href="/discussions/" class="w-10 h-10 rounded-full bg-[#161D2B] border border-white/10 flex items-center justify-center text-white/80 hover:text-white transition-colors" title="Annuler">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </a>

    <h1 class="text-sm font-extrabold text-white">Nouvelle Story (24h)</h1>

    <div class="w-10"></div> <!-- Placeholder balance -->
  </header>

  <main class="max-w-md mx-auto px-4 w-full flex-1 flex flex-col justify-center my-4">
    
    <!-- Mode Switcher Pill -->
    <div class="flex items-center justify-center p-1 bg-[#161D2B] rounded-full border border-white/10 mb-5 max-w-xs mx-auto">
      <button onclick="switchMode('text')" id="btn-mode-text" class="flex-1 py-2 px-4 rounded-full text-xs font-bold bg-mara text-white transition-all">
        Texte
      </button>
      <button onclick="switchMode('media')" id="btn-mode-media" class="flex-1 py-2 px-4 rounded-full text-xs font-bold text-theme-muted hover:text-white transition-all">
        Photo / Vidéo
      </button>
    </div>

    <!-- Form -->
    <form method="POST" enctype="multipart/form-data" action="{% url 'story_create' %}" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="media_type" id="input-media-type" value="text" />
      <input type="hidden" name="bg_gradient" id="input-bg-gradient" value="linear-gradient(135deg, #FF4565 0%, #FF8038 100%)" />

      <!-- TEXT MODE PREVIEW & INPUT -->
      <div id="section-text" class="space-y-4">
        <!-- Live Preview Canvas -->
        <div id="story-preview-card" class="w-full aspect-[9/14] rounded-3xl p-6 flex items-center justify-center text-center shadow-2xl relative overflow-hidden transition-all" style="background: linear-gradient(135deg, #FF4565 0%, #FF8038 100%);">
          <textarea
            id="text-content-area"
            name="text_content"
            rows="5"
            placeholder="Écris ta pensée du jour, une question ou une humeur..."
            class="w-full bg-transparent text-white text-2xl font-extrabold text-center placeholder:text-white/60 outline-none resize-none drop-shadow-md"
            oninput="updateStoryText(this.value)"
          ></textarea>
        </div>

        <!-- Gradient Palette Selector -->
        <div>
          <p class="text-xs text-theme-muted font-bold mb-2 uppercase tracking-wider text-center">Choisis ton ambiance</p>
          <div class="flex items-center justify-center gap-3">
            <button type="button" onclick="setGradient('linear-gradient(135deg, #FF4565 0%, #FF8038 100%)')" class="w-9 h-9 rounded-full border-2 border-white shadow-md" style="background: linear-gradient(135deg, #FF4565 0%, #FF8038 100%);"></button>
            <button type="button" onclick="setGradient('linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%)')" class="w-9 h-9 rounded-full border border-white/20 shadow-md" style="background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);"></button>
            <button type="button" onclick="setGradient('linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%)')" class="w-9 h-9 rounded-full border border-white/20 shadow-md" style="background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%);"></button>
            <button type="button" onclick="setGradient('linear-gradient(135deg, #10B981 0%, #059669 100%)')" class="w-9 h-9 rounded-full border border-white/20 shadow-md" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);"></button>
            <button type="button" onclick="setGradient('linear-gradient(135deg, #1E1B4B 0%, #311042 100%)')" class="w-9 h-9 rounded-full border border-white/20 shadow-md" style="background: linear-gradient(135deg, #1E1B4B 0%, #311042 100%);"></button>
          </div>
        </div>
      </div>

      <!-- MEDIA MODE UPLOAD -->
      <div id="section-media" class="hidden space-y-4">
        <label for="story-media-file" class="block w-full aspect-[9/14] rounded-3xl bg-[#161D2B] border-2 border-dashed border-white/20 hover:border-mara-pink flex flex-col items-center justify-center p-6 cursor-pointer text-center group transition-colors relative overflow-hidden">
          <img id="media-preview-img" class="absolute inset-0 w-full h-full object-cover hidden" alt="Aperçu" />
          <div id="media-upload-placeholder" class="space-y-3">
            <div class="w-16 h-16 rounded-full bg-white/5 text-mara-pink flex items-center justify-center mx-auto group-hover:scale-110 transition-transform">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <p class="text-sm font-bold text-white">Prendre une photo ou importer</p>
            <p class="text-xs text-theme-muted">Image ou vidéo (max 24h)</p>
          </div>
          <input type="file" id="story-media-file" name="media_file" accept="image/*,video/*" class="hidden" onchange="handleMediaPreview(this)" />
        </label>
      </div>

      <!-- Submit Action -->
      <div class="pt-2">
        <button type="submit" class="w-full btn-mara py-3.5 rounded-2xl text-sm font-extrabold shadow-lg">
          Publier en Story (24h) ✨
        </button>
      </div>
    </form>

  </main>

  <!-- Bottom Nav -->
  {% include 'includes/bottom_nav.html' with active_tab='stories' %}
</div>

<script>
  function switchMode(mode) {
    const secText = document.getElementById('section-text');
    const secMedia = document.getElementById('section-media');
    const btnText = document.getElementById('btn-mode-text');
    const btnMedia = document.getElementById('btn-mode-media');
    const typeInput = document.getElementById('input-media-type');

    if (mode === 'text') {
      secText.classList.remove('hidden');
      secMedia.classList.add('hidden');
      btnText.className = 'flex-1 py-2 px-4 rounded-full text-xs font-bold bg-mara text-white transition-all';
      btnMedia.className = 'flex-1 py-2 px-4 rounded-full text-xs font-bold text-theme-muted hover:text-white transition-all';
      typeInput.value = 'text';
    } else {
      secText.classList.add('hidden');
      secMedia.classList.remove('hidden');
      btnMedia.className = 'flex-1 py-2 px-4 rounded-full text-xs font-bold bg-mara text-white transition-all';
      btnText.className = 'flex-1 py-2 px-4 rounded-full text-xs font-bold text-theme-muted hover:text-white transition-all';
      typeInput.value = 'image';
    }
  }

  function setGradient(gradient) {
    document.getElementById('story-preview-card').style.background = gradient;
    document.getElementById('input-bg-gradient').value = gradient;
  }

  function handleMediaPreview(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('media-preview-img');
        const placeholder = document.getElementById('media-upload-placeholder');
        preview.src = e.target.result;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>
{% endblock %}
