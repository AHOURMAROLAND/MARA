version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mara
      POSTGRES_USER: mara
      POSTGRES_PASSWORD: mara_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://mara:mara_password@db:5432/mara
    depends_on:
      - db

volumes:
  postgres_data:
